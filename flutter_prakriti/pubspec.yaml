name: prakriti
description: "Prakriti - Jeevo paramo dharma. Mobile ecological app for Android and iOS with 108 scoring, genuine organic marketplace, community circles, multilingual voice assistant, and Gemini AI image creation & editing."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI and Styling
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  intl: ^0.20.3
  lucide_icons: ^0.254.0

  # Networking and API
  http: ^1.2.2
  cached_network_image: ^3.3.1

  # Audio and Speech
  flutter_tts: ^4.2.2
  speech_to_text: ^7.0.0

  # Security and Vault
  flutter_secure_storage: ^9.2.2
  cryptography: ^2.7.2

  # Device and Permissions
  geolocator: ^13.0.1
  image_picker: ^1.1.2
  share_plus: ^10.0.2
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
